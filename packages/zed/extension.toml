id = "json-to-csv-converter"
name = "JSON to CSV Converter"
description = "Convert JSON to CSV or Excel and CSV to JSON, with automatic format detection, streaming, progress, row limits, cancellation, and optional task shortcuts."
version = "0.4.0"
schema_version = 1
authors = ["spicytree <uquantum@hotmail.com>"]
repository = "https://github.com/dancvv/json-to-csv-converter"

[context_servers.json-to-csv-converter]
name = "JSON to CSV Converter"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]

[[capabilities]]
kind = "process:exec"
command = "which"
args = ["json-to-csv-converter-mcp"]

[[capabilities]]
kind = "process:exec"
command = "where"
args = ["json-to-csv-converter-mcp"]
