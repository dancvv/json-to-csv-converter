[workspace]
members = [
    "crates/json-to-csv-converter-core",
    "crates/json-to-csv-converter-mcp",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["spicytree <uquantum@hotmail.com>"]
license = "MIT"
repository = "https://github.com/dancvv/json-to-csv-converter"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
chardetng = "1.0"
csv = "1.3"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
rust_xlsxwriter = { version = "0.97.1", features = ["constant_memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "io-std", "time"] }
tokio-util = "0.7"
